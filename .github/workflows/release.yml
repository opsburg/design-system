name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: read
    packages: write

jobs:
    secrets:
        # A secret committed anywhere in the history blocks the release (see .gitleaksignore)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Gitleaks
              run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --verbose .

    publish:
        needs: secrets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://npm.pkg.github.com
                  scope: "@opsburg"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Align package version with tag
              run: pnpm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

            - name: Publish to GitHub Packages
              run: pnpm publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
